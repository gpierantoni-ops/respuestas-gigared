<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Completo de Respuestas - Gigared</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar-bg:#000000;
  --bg:#000000;--bg2:#0A0A0A;
  --card:#111111;--card-border:#222222;
  --green-bright:#34D399;--green-light:#A7F3D0;
  --green-bg:#064E3B;--dark:#FFFFFF;--text:#E5E7EB;
  --muted:#9CA3AF;--font:'Plus Jakarta Sans',sans-serif;
  --bg-chat:#000000;--input-bg:#181818;--input-border:#333333;--overlay:rgba(0,0,0,0.8);
}

html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:#000000;color:var(--text);display:flex;position:relative;-webkit-font-smoothing:antialiased}

#sidebar{width:290px;min-width:290px;background:#000000;display:flex;flex-direction:column;padding:20px 12px;gap:6px;overflow-y:auto;z-index:10;border-right:1px solid #222222}
.app-brand{display:flex;align-items:center;gap:12px;padding:6px 8px 16px;margin-bottom:4px;border-bottom:1px solid #222222}
.app-brand .icon{width:42px;height:42px;background:var(--green-bright);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000000}
.app-brand .name{font-size:15px;font-weight:800;color:white;line-height:1.2}
.app-brand .sub{font-size:9.5px;color:rgba(255,255,255,0.5);font-weight:500}

.cat-group{margin-bottom:4px}
.cat-btn{width:100%;display:flex;align-items:center;background:none;border:none;color:rgba(255,255,255,0.9);font-family:var(--font);font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;gap:10px}
.cat-btn:hover,.cat-btn.open{background:#181818;color:var(--green-light)}
.cat-btn .arrow{margin-left:auto;font-size:8px;transition:transform .3s;opacity:.6}
.cat-btn.open .arrow{transform:rotate(90deg);opacity:1}

.subcat{display:flex;flex-direction:column;gap:2px;padding:2px 0 6px 14px;max-height:0;overflow:hidden;transition:max-height .35s ease}
.subcat.open{max-height:1500px}
.sub-btn{background:none;border:none;color:rgba(255,255,255,0.65);font-family:var(--font);font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.sub-btn:hover,.sub-btn.active{background:#222222;color:var(--green-light)}
.sub-dot{width:5px;height:5px;border-radius:50%;background:var(--green-bright)}

.sidebar-footer{margin-top:auto;padding-top:10px;border-top:1px solid #222222;display:flex;flex-direction:column;gap:6px}
.count-badge{background:#111111;border:1px solid #222222;border-radius:8px;padding:8px 12px;font-size:10px;color:var(--green-light);text-align:center;font-weight:700}
.sidebar-footer button{width:100%;background:#111111;border:1px solid #222222;color:rgba(255,255,255,0.8);padding:8px 12px;border-radius:10px;font-size:10.5px;font-weight:700;cursor:pointer;transition:all .2s}
.sidebar-footer button:hover{background:#222222;color:var(--green-light)}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 16px 0 16px;gap:10px;background:#000000}
#topbar{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-wrap{flex:1;display:flex;align-items:center;background:#111111;border:1px solid #222222;border-radius:10px;padding:0 14px;height:43px;gap:8px}
.search-wrap input{flex:1;border:none;outline:none;font-family:var(--font);font-size:12px;font-weight:600;color:#FFFFFF;background:none}

.top-btn{height:39px;background:#111111;border:1px solid #222222;border-radius:10px;color:var(--green-light);font-family:var(--font);font-size:11px;font-weight:700;padding:0 13px;cursor:pointer}
.top-btn:hover{background:#222222}

#list{flex:1;overflow-y:auto;padding-bottom:22px;padding-right:4px;display:flex;flex-direction:column;gap:12px}
.item{background:#111111;border:1px solid #222222;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.8);position:relative;border-left:4px solid var(--green-bright)}
.item-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item-cat-badge{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:6px;background:#064E3B;color:var(--green-light);border:1px solid rgba(52,211,153,0.3)}
.item-title{font-size:15px;font-weight:800;color:var(--green-light);margin-bottom:8px}
.item-body{font-size:13px;font-weight:500;color:#F3F4F6;white-space:pre-wrap;word-break:break-word;line-height:1.7;background:#050505;padding:12px 14px;border-radius:8px;border:1px solid #222222}
.item-footer{display:flex;align-items:center;gap:8px;margin-top:12px}
.copy-btn{display:flex;align-items:center;gap:6px;background:var(--green-bright);color:#000000;border:none;border-radius:9px;padding:9px 18px;font-size:11px;font-weight:800;cursor:pointer;transition:all .2s}
.copy-btn:hover{background:var(--green-light);transform:scale(1.02)}

#toast{position:fixed;bottom:24px;right:24px;background:#181818;color:var(--green-light);border:1px solid var(--green-bright);padding:11px 20px;border-radius:12px;font-size:11.5px;font-weight:700;z-index:9999;opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

/* PANEL VARIABLES */
.vars-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:700;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.vars-panel-overlay.open{opacity:1;pointer-events:all}
.vars-panel{position:fixed;top:0;right:0;width:420px;max-width:100vw;height:100vh;background:#111111;border-left:1px solid #222222;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s;z-index:701}
.vars-panel-overlay.open .vars-panel{transform:translateX(0)}
.vars-panel-header{padding:18px 20px;border-bottom:1px solid #222222;display:flex;align-items:center;gap:12px}
.wa-preview-wrap{padding:14px 18px;border-bottom:1px solid #222222;background:#050505}
.wa-chat-bg{border-radius:11px;background:#0A0A0A;border:1px solid #222222;padding:12px 10px}
.wa-bubble{max-width:90%;margin-left:auto;background:#064E3B;border:1px solid rgba(52,211,153,0.3);border-radius:12px 2px 12px 12px;padding:9px 12px}
.wa-bubble-text{font-size:.8rem;line-height:1.6;color:#FFFFFF;white-space:pre-wrap}
.vars-form{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.var-field-group{display:flex;flex-direction:column;gap:4px}
.var-label{font-size:.76rem;font-weight:700;color:var(--green-light)}
.var-input{padding:8px 12px;border-radius:10px;border:1.5px solid #333333;background:#181818;color:#FFFFFF;font-family:var(--font);font-size:.83rem;width:100%}
.var-input:focus{outline:none;border-color:var(--green-bright)}
.vars-panel-footer{padding:12px 18px;border-top:1px solid #222222;display:flex;gap:8px}
.m-btn{border:none;border-radius:9px;padding:9px 20px;font-family:var(--font);font-size:11.5px;font-weight:800;cursor:pointer}
.m-btn.cancel{background:#222222;color:var(--muted)}
.m-btn.save{background:var(--green-bright);color:#000000}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="app-brand"><div class="icon">💬</div><div><div class="name">Gigared Respuestas</div><div class="sub">Manual Completo WhatsApp</div></div></div>
  <div id="sidebar-cats"></div>
  <div class="sidebar-footer">
    <div class="count-badge" id="total-badge">0 respuestas</div>
    <button onclick="showAll()">🗂 Ver Todas</button>
    
    <!-- BOTONES IMPORTAR Y EXPORTAR JSON -->
    <div style="display:flex; gap:6px; margin-top:4px;">
      <button onclick="exportJSON()" style="flex:1; background:#064E3B; color:#A7F3D0; border:1px solid rgba(52,211,153,0.4);">
        📤 Exportar JSON
      </button>
      <button onclick="importJSON()" style="flex:1; background:#181818; color:white; border:1px solid #333333;">
        📥 Importar JSON
      </button>
    </div>
    <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="processJSONImport(this)">
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <div class="search-wrap"><span>🔍</span><input id="search-in" placeholder="Buscar por palabra clave (ej: módem, fútbol, clave, baja)..." oninput="onSearch(this)"></div>
    <button class="top-btn" onclick="showAll()">🗂 Mostrar Todas</button>
  </div>
  <div id="list"></div>
</div>

<div class="vars-panel-overlay" id="vars-panel-overlay" onclick="if(event.target===this)closeVarsPanel()">
  <div class="vars-panel">
    <div class="vars-panel-header">
      <div>
        <div style="font-weight:800;font-size:15px;color:var(--green-light)">Completar Datos</div>
        <div style="font-size:0.75rem;color:var(--muted)" id="vars-panel-response-title">—</div>
      </div>
      <button onclick="closeVarsPanel()" style="margin-left:auto;border:none;background:none;cursor:pointer;font-size:16px;color:#FFF">✕</button>
    </div>
    <div class="wa-preview-wrap">
      <div style="font-size:10px;font-weight:800;color:var(--green-light);margin-bottom:6px">VISTA PREVIA WHATSAPP</div>
      <div class="wa-chat-bg">
        <div class="wa-bubble">
          <div class="wa-bubble-text" id="wa-bubble-text">…</div>
        </div>
      </div>
    </div>
    <div class="vars-form" id="vars-form"></div>
    <div class="vars-panel-footer">
      <button class="m-btn cancel" onclick="closeVarsPanel()">Cancelar</button>
      <button class="m-btn save" onclick="executeVarsCopy()">📋 Copiar Texto</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const GROUPS = [
  {id:'saludos', label:'Despedidas y Saludos', icon:'👋'},
  {id:'tecnico', label:'Reclamos Técnicos', icon:'🛠️'},
  {id:'ventas', label:'Ventas y Cobertura', icon:'🚀'},
  {id:'admin', label:'Gestión Administrativa', icon:'📋'},
  {id:'tv_gigared', label:'TV y Gigared Play', icon:'📺'},
  {id:'retencion', label:'Promociones y Bajas', icon:'🎁'}
];

const SUBCATS = [
  {id:'saludos_sec', label:'Saludos y Ubicación', parent:'saludos', icon:'💬'},
  {id:'tec_internet', label:'Internet y Módems', parent:'tecnico', icon:'🌐'},
  {id:'tec_decos', label:'Decodificadores y TV', parent:'tecnico', icon:'📺'},
  {id:'tec_fallas', label:'Fallas Generales y OT', parent:'tecnico', icon:'🔧'},
  {id:'vtas_cobertura', label:'Cobertura y Ubicación', parent:'ventas', icon:'📍'},
  {id:'vtas_promos', label:'Promociones G1, G2, G3', parent:'ventas', icon:'🎁'},
  {id:'vtas_futbol', label:'Pack Fútbol y Gigacam', parent:'ventas', icon:'⚽'},
  {id:'vtas_offnet', label:'Ventas Offnet', parent:'ventas', icon:'🌐'},
  {id:'admin_pagos', label:'Pagos y Comprobantes', parent:'admin', icon:'💳'},
  {id:'admin_cambios', label:'Titularidad, Domicilio y Débito', parent:'admin', icon:'🏠'},
  {id:'tv_play_sec', label:'Gigared Play y Packs', parent:'tv_gigared', icon:'📱'},
  {id:'ret_bajas_sec', label:'Bajas, Retenciones y Deuda', parent:'retencion', icon:'❌'}
];

const DATA = [
  // SALUDOS Y DESPEDIDAS
  {id:1, cat:'saludos_sec', title:'👋 Saludo Inicial', text:'¡Hola! Buenas tardes. 👋 Gracias por comunicarte. ¿En qué podemos ayudarte hoy?'},
  {id:2, cat:'saludos_sec', title:'📝 ¿Necesitás ayuda en algo más?', text:'¿Necesitás que te ayude en algo más? 📝🛠️✨'},
  {id:3, cat:'saludos_sec', title:'🆔 Solicitud Datos Titular', text:'¡Hola! 👋 Un gusto saludarte.\nPor favor, decime en qué podemos ayudarte hoy. Para agilizar la gestión, ¿me podrías pasar alguno de estos datos para identificar tu cuenta?\nDNI del titular\nDomicilio y localidad\nQuedo atento a tu respuesta.'},
  {id:4, cat:'saludos_sec', title:'📍 Pasa Ubicación', text:'Por favor sólo escribí tu calle (sólo una calle) y la altura exacta. Si residís en un barrio, nombre del mismo, manzana y casa o puerta.\n¡Quedamos atentos a tus datos para avanzar!'},

  // RECLAMOS TECNICOS - INTERNET Y MÓDEMS
  {id:5, cat:'tec_internet', title:'🔑 Cambio de Clave WiFi', text:'Te pido que me indiques la clave nueva que querés colocar. Recordá que debe tener un mínimo de 8 caracteres y puede incluir mayúsculas, minúsculas, símbolos y números.'},
  {id:6, cat:'tec_internet', title:'❌ Consulta por Falla', text:'👋 Hola! 📱💬 Te voy a ayudar con tu caso.\n¿Podrías contarnos qué sucede? Por ejemplo:\n❌ ¿Estás totalmente sin señal?\n📉 ¿O notas lentitud en la navegación?\nContanos el detalle y nos ponemos manos a la obra para corregirlo.\nQuedo atenta para ayudarte. 💬'},
  {id:7, cat:'tec_internet', title:'🔄 Reinicio Manual CM (Cable Módem)', text:'¡Hola! Verificamos en el sistema que los niveles de señal hacia tu módem son correctos y no registramos fallas masivas en la zona.\nPara restablecer la conexión, por favor realizá estos pasos:\n1️⃣ Desconectá el equipo de la corriente eléctrica por 10 segundos.\n2️⃣ Desenroscá el cable coaxial (de rosca metálica) y volvé a enroscarlo con la mano hasta que haga tope.\n3️⃣ Volvé a conectarlo a la electricidad.\nAguardá de 3 a 5 minutos a que enciendan todas las luces e indicame cómo retoma la señal. 😊\nQuedamos atentos!'},
  {id:8, cat:'tec_internet', title:'🔧 Configuración de Parámetro', text:'🔧 Hemos verificado la conexión y realizamos una configuración de parámetros en el equipo.\n✅ Los ajustes fueron aplicados correctamente para optimizar el servicio.\n🙏 Te pedimos, por favor, que aguardes a que retome señal y verifiques nuevamente el funcionamiento.\n🌐 En caso de continuar con inconvenientes, avísanos por este medio para poder ayudarte.'},

  // RECLAMOS TECNICOS - DECOS Y TV
  {id:9, cat:'tec_decos', title:'📺 Reclamo TV - Sintonización', text:'¡Hola! 👋 Confirmamos que el servicio en tu zona funciona bien,¿probaste hacer una sintonización en tu televisor?\nProbá con estos pasos 👇\n📺 TVs más viejos (con cable coaxial):\n1️⃣ En el control remoto, buscá la opción CATV / AIRE / CABLE (puede estar en el menú o como botón físico)\n2️⃣ Si es LED, andá a INPUT o SOURCE y elegí CABLE / CATV\n3️⃣ Después andá al MENÚ del TV → Sintonía automática / Búsqueda automática\n4️⃣ Esperá que termine\n📺 TVs nuevos (smart):\n1️⃣ Entrá al MENÚ del TV\n2️⃣ Buscá Sintonía automática / Autoprogramación\n3️⃣ Cuando te pregunte, elegí CATV / Cable\n4️⃣ Esperá que termine\nSi sigue igual, contame:\n🔸 ¿Qué mensaje o error ves exactamente?\nAsí te ayudo más rápido'},
  {id:10, cat:'tec_decos', title:'🔄 Reclamo Deco - Reset de Fábrica IPO 85', text:'Buenos días 👋\nTe comento, por lo que indicas de la falla, si ocurre en el decodificador deberemos gestionar un reseteo de fábrica del equipo para solucionarlo, te indico los pasos:\n1️⃣ Presioná el botón Menú en el control remoto de tu decodificador.\n2️⃣ En el menú de la derecha, seleccioná Ajuste de sistema (o Settings). Usá la flecha hacia la derecha para ingresar a las opciones.\n3️⃣ Bajá con las flechas hasta la opción Valores de Fábrica.\n4️⃣ El sistema te va a pedir una contraseña. Probá ingresando 8888 o 0000.\n5️⃣ Cuando te pregunte si querés volver a los valores por defecto, seleccioná SÍ y presioná el botón OK.\n🔄 ¡Listo! Una vez realizado el reset, el decodificador hará un barrido automático de manera interna para volver a buscar y cargar todos los canales.\nEsto puede demorar unos minutos. ¡Cualquier duda, avísame! 😊'},
  {id:11, cat:'tec_decos', title:'🔍 Barrido Cardless (Clave 2222)', text:'¡Hola! 👋 . Te comparto los pasos detallados para realizar el barrido de canales en tu decodificador:\n📺 Procedimiento para realizar el barrido:\n1️⃣ Presioná el botón Menu en tu control remoto.\n2️⃣ Una vez que veas el menú en pantalla, seleccioná la opción "DVBC Installation".\n3️⃣ Cuando el sistema te solicite ingresar la contraseña, introducí 2222.\n4️⃣ Volvé a seleccionar la opción "DVBC Installation" en la nueva pantalla.\n5️⃣ Seleccioná "Auto Search" y presioná el botón OK en tu control remoto.\n🔄 ¡Listo! El decodificador comenzará de inmediato a realizar el barrido y escaneo automático para volver a cargar todos tus canales.\n(Esperá unos minutos a que finalice el porcentaje en pantalla). ¡Cualquier duda, avisame! 😊'},
  {id:12, cat:'tec_decos', title:'📺 Consulta Falla Decodificador', text:'👋 [NOMBRE DE LA PERSONA O LO QUE QUIERAS] 😊\n📌 Coméntame qué es lo que está sucediendo.\n❓ ¿Estás sin señal por completo en el decodificador?\n⚽ ¿El inconveniente es únicamente con el Pack Fútbol?\n📺 ¿O se trata de algún canal en particular?\n😊 Contame un poco más para que podamos revisarlo y ayudarte.'},
  {id:13, cat:'tec_decos', title:'🔌 Configuración Remota Decodificador', text:'👋 Comprendo 😊\n📌 Acabamos de realizar una configuración desde nuestro sistema.\nTe pedimos por favor que:\n🔌 Desconectes el decodificador de la corriente.\n⏳ Esperes unos segundos y vuelvas a conectarlo.\n📺 Aguarda unos instantes a que realice la búsqueda automática de señal.\n😊 Luego indicarnos si el servicio retomó correctamente.'},

  // RECLAMOS TECNICOS - FALLAS GENERALES Y DERIVACIONES
  {id:14, cat:'tec_fallas', title:'⚠️ Falla General Masiva', text:'¡Hola! Mi nombre es Guido. Detectamos una falla general e imprevista en tu zona que está afectando la señal de tu servicio. ⚠️📉 Nuestro equipo técnico ya se encuentra al tanto del imprevisto para solucionarlo lo antes posible.\nNo hace falta que toques o reinicies tu módem, ya que el servicio se va a normalizar de forma automática en el transcurso del día. ⏳\nTe pedimos disculpas por este inconveniente y agradecemos mucho tu paciencia mientras lo resolvemos. 😊'},
  {id:15, cat:'tec_fallas', title:'🛠️ Solución de Falla General', text:'Te pedimos disculpas por los inconvenientes. Queríamos informarte que hasta hace unos instantes teníamos una falla masiva en la zona, pero ya fue solucionada 🛠️✅.\nPara reestablecer tu conexión, por favor realizá estos pasos:\n1️⃣ Desconectá el equipo de la corriente eléctrica por 10 segundos.\n2️⃣ Volvé a conectarlo.\nAvisame si te vuelve la señal o si sigue fallando, ¡así lo verificamos de inmediato! 😊👍'},
  {id:16, cat:'tec_fallas', title:'📞 Se Deriva Reclamo Técnico', text:'¡Hola! 👋\nLe informamos que su reclamo fue registrado y derivado al sector técnico para su verificación.\nPor favor, indíquenos:\n📞 Un número de teléfono fijo y un celular.\n🕒 Una franja horaria de al menos 2 horas para poder contactarlo en caso de ser necesario.\nEl plazo máximo de respuesta es de hasta 72 hs hábiles.\nAdemás, necesitamos confirmar:\n🔌 ¿El módem está conectado a la corriente?\n🔴 ¿El equipo tiene alguna luz roja encendida?'},
  {id:17, cat:'tec_fallas', title:'⚙️ Orden de Trabajo (OT) Generada', text:'⚙️🔧Te informo que hemos generado una Orden de Trabajo.\n⏳ Daremos aviso a nuestro sector técnico para que se haga todo lo posible por acortar los plazos estimados de demora para solucionar el inconveniente.\nDisculpa las molestias ocasionadas.'},
  {id:18, cat:'tec_fallas', title:'📋 Reconfirmación Reclamo Derivado', text:'¡Te informamos que ya hemos derivado al área técnica el reclamo!\nTe pedimos disculpas por los inconvenientes. Recordá que el plazo es de 24hs a 72hs hábiles.\n¿Necesitás que te ayude en algo más? 📝🛠️✨'},
  {id:19, cat:'tec_fallas', title:'📡 Reclamo ONU Online / Intermitencia', text:'Comprendo. Como el sistema indica que el módem está conectado pero reportás cortes, voy a derivar tu caso directamente a soporte técnico para que verifiquen la intermitencia.\nEl plazo estimado de resolución es de 24 a 72 horas hábiles. El equipo técnico trabajará de manera remota para estabilizar tu línea. En caso de requerir una revisión física en tu domicilio, te contactaremos para coordinar una visita.\nPara registrar el reclamo, ¿me confirmás tu teléfono de contacto?'},

  // VENTAS Y COBERTURA - UBICACION Y SOLICITUDES
  {id:20, cat:'vtas_cobertura', title:'📍 Consulta Cobertura', text:'¡Hola! Un gusto saludarte. 👋 Para poder confirmarte cobertura y pasarte las promos vigentes, por favor déjanos por acá:\n📍 Calle, altura exacta, entre calles y ciudad donde residís.\nSi residís en un barrio, nombre del mismo, manzana y casa o puerta\n¡Quedamos atentos a tus datos para avanzar!'},
  {id:21, cat:'vtas_cobertura', title:'🗺️ Coordenadas Link GPS', text:'Para verificar si tenemos cobertura en tu zona, ¿me podrías mandar tus coordenadas actual por WhatsApp? Así lo chequeamos en el mapa. ¡Gracias!'},
  {id:22, cat:'vtas_cobertura', title:'📌 Solicito Piso y Dpto', text:'📌 Te solicitamos por favor que nos indiques el piso y departamento 😊\nAsí podemos verificar correctamente el domicilio y continuar con la gestión.\n🙏 Quedamos atentos.'},
  {id:23, cat:'vtas_cobertura', title:'❓ Consulta por Pack de Interés', text:'Te informamos que contamos con cobertura en la dirección indicada.\n¿En qué servicio estás interesado? Por favor, indícanos el número de tu preferencia:\n1️⃣ Internet.\n2️⃣ TV + Internet.\n3️⃣ TV + Internet + Telefonía IP.\nAguardamos tu selección para proceder con el pedido.'},
  {id:24, cat:'vtas_cobertura', title:'🏠 Cliente Activo en Domicilio (Terreno Multipropiedad)', text:'👋 Buenas tardes 😊\n📌 Verificamos que en el domicilio solicitado contamos con servicio activo.\n🔎 Sin embargo, no nos figura identificado como departamento ni como casa 1.\n🏠 ¿El domicilio corresponde a un mismo terreno con varias casas o departamentos?\n🙏 Quedamos atentos para poder verificar correctamente la ubicación.'},

  // VENTAS - PROMOCIONES G1, G2, G3
  {id:25, cat:'vtas_promos', title:'🎁 G1 Internet Solo', text:'🎁 PROMO: 1 mes GRATIS +[COMPLETAR] meses con [COMPLETAR]% de descuento (Efectivo o Débito).\n🚀 Planes:\n🌐 150 Mb: $[COMPLETAR] Lista: $[COMPLETAR]\n🌐 300 Mb: $[COMPLETAR] Lista: $[COMPLETAR]\n🌐 500 Mb: $[COMPLETAR] Lista: $[COMPLETAR]\n🌐 1000 Mb: $[COMPLETAR] Lista: $[COMPLETAR]\n(Precios sujetos a aumentos generales).\n✅ Instalación y días proporcionales BONIFICADOS.\n📌 Importante: Permanencia mínima 12 meses. El valor bonificado es de $[COMPLETAR]. De pedir la baja antes del período de permanencia, deberá abonar dicho monto.\n📝 ¿Querés el alta? Pasanos:\nNombre y Apellido:\nDNI:\nDomicilio:\nPlan:\nTeléfono:\nEmail:\nMedio de pago: (Efectivo, Tarjeta Crédito o CBU).\nRequisitos: Foto DNI y factura a tu nombre o contrato alquiler.\n¡Quedamos atentos! 🚀'},
  {id:26, cat:'vtas_promos', title:'🎁 G2 Internet + TV', text:'🎁 PROMO: 1 mes GRATIS +[COMPLETAR] meses con [COMPLETAR]% de descuento (Efectivo o Débito).\n🚀 Packs TV + Internet:\n🌐 TV + 150 Megas: $[COMPLETAR] Lista: $[COMPLETAR]\n🌐 TV + 300 Megas: $[COMPLETAR] Lista: $[COMPLETAR]\n🌐 TV + 500 Megas: $[COMPLETAR] Lista: $[COMPLETAR]\n🌐 TV + 1000 Megas: $[COMPLETAR] Lista: $[COMPLETAR]\n(Precios sujetos a aumentos generales).\n✅ Instalación y días proporcionales BONIFICADOS.\n📺 Incluye 2 bocas de TV gratis. Adicionales: $[COMPLETAR] c/u.\n📌 Importante: Permanencia mínima 12 meses. El valor bonificado es de $[COMPLETAR]. De pedir la baja antes del periodo de permanencia, deberá abonar dicho monto.\n📝 ¿Querés el alta? Pasanos:\nNombre y Apellido:\nDNI:\nDomicilio:\nPlan:\nCantidad de bocas TV:\nTeléfono:\nEmail:\nMedio de pago: (Efectivo, Tarjeta Crédito o CBU).\nRequisitos: Foto DNI y factura a tu nombre o contrato alquiler.\n¡Quedamos atentos!'},
  {id:27, cat:'vtas_promos', title:'🎁 G3 Internet + TV + Telefonía', text:'🎁 PROMO: 1 mes GRATIS + [COMPLETAR] meses con [COMPLETAR] % de descuento (Efectivo o Débito).\n🚀 Packs TV + Internet:+ Telefonía\n🌐 TV + 150 Megas + TEL: $[COMPLETAR] (Lista: $[COMPLETAR])\n🌐 TV + 300 Megas + TEL: $[COMPLETAR] (Lista: $[COMPLETAR])\n🌐 TV + 500 Megas + TEL: $[COMPLETAR] (Lista: $[COMPLETAR])\n🌐 TV + 1000 Megas + TEL: $[COMPLETAR] (Lista: $[COMPLETAR])\n(Precios sujetos a aumentos generales).\n✅ Instalación y días proporcionales BONIFICADOS.\n📺 Incluye 2 bocas de TV gratis. Adicionales: $[COMPLETAR] c/u.\n📌 Importante: Permanencia mínima 12 meses. El valor bonificado es de $[COMPLETAR]. De pedir la baja antes del periodo de permanencia, deberá abonar dicho monto.\n📝 ¿Querés el alta? Pasanos:\nNombre y Apellido:\nDNI:\nDomicilio:\nPlan:\nCantidad de bocas TV:\nTeléfono:\nEmail:\nMedio de pago: (Efectivo, Tarjeta Crédito o CBU).\nRequisitos: Foto DNI y factura a tu nombre o contrato alquiler.\n¡Quedamos atentos! 🚀'},
  {id:28, cat:'vtas_promos', title:'🥳 Confirmación de Alta de Servicio', text:'Tu pedido quedó registrado y derivado al sector correspondiente para dar curso al alta del servicio. 🥳\nRecordá tener a mano la documentación solicitada 📝\nDentro del plazo de (o antes 🤞) los instaladores se van a estar comunicando para poder coordinar la visita a tu domicilio 🔧\nCualquier duda o consulta que te haya quedado, no dudes en avisarme.\nTe agradezco mucho la confianza, ¡Bienvenido a Gigared!\n¡Que tengas un muy buen día! 🙌'},

  // VENTAS - PACK FUTBOL, GIGACAM Y OFFNET
  {id:29, cat:'vtas_futbol', title:'⚽ Ofrecer Pack Fútbol', text:'Te compartimos la información sobre el Pack Fútbol! ⚽\n💰 Valor del pack: $28290 . por mes + días proporcionales con cargo.\n📺 Opciones disponibles:\n1️⃣ Por decodificador (TV)\n• Instalación: $75600 o 3 cuotas de $25200\n• PROMO: Si adherís el pago a débito automático con tarjeta de crédito, ¡la instalación es SIN CARGO! ✅\n• Tiempo de instalación: 7 a 10 días hábiles.\n2️⃣ Por APP (Gigared Play) + Gigared Play Full\n• Activación en el día para uso en celular. 📱\n• Para utilizarlo en TV o PC, se debe agregar el pack “Play Full”.\n💰 Valor de Play Full:\n• Precio regular: $10.500\n• Promo por 12 meses con 75% OFF: $2.625\n(Valores sujetos a aumentos generales).\n⚠️ En caso de solicitar la baja del servicio, el tiempo mínimo de permanencia es de 1 mes. Los precios no son fijos pueden estar sujeto a aumentos\nPara continuar con la solicitud, por favor indicanos:\n✅ Opción elegida (Deco o APP + Full)\n✅ Nombre completo y DNI del titular'},
  {id:30, cat:'vtas_futbol', title:'📷 Gigacam (Cámaras de Seguridad)', text:'📷 ¡Hola! Te compartimos la información de GIGACAM (requiere internet de 100 Mb o más).\n✨ Características: Conexión WiFi, detección de movimiento, visión nocturna, audio bidireccional y grabación en MicroSD desde la App. (No incluye tarjeta MicroSD).\n📷 Costos actualizados:\n🏠 Indoor / 🌳 Outdoor 💰 Mantenimiento: $3.100/mes 🛠️ Instalación: $16.700 (o 6 cuotas de $2.784)\n📦 Pack x2 💰 Mantenimiento: $4.340/mes 🛠️ Instalación: $23.900 (o 6 cuotas de $3.984)\n📦 Pack x3 💰 Mantenimiento: $5.580/mes 🛠️ Instalación: $30.750 (o 6 cuotas de $5.125)\n⚠️ Precios sujetos a futuros aumentos generales.\n💳 Pago de instalación: 1 pago o 6 cuotas a contra factura sin recargo. 🛠️ Plazo: 5 a 10 días hábiles.\n📌 Para solicitarlo, envianos:\n🔹 N° de cliente:\n🔹 Nombre, Apellido y DNI/CUIT del titular:\n🔹 Modelo o Pack elegido:\n🔹 Forma de pago de instalación (1 pago o 6 cuotas):\n¡Quedamos atentos a tu respuesta! 🙌'},
  {id:31, cat:'vtas_offnet', title:'😔 Sin Cobertura Red Física - OffNet', text:'Lamentamos informarte que, según nuestro sistema, no contamos con cobertura de red física en la dirección indicada. 😔\n¡Sin embargo! 🥳 Podés disfrutar de todo nuestro contenido con Gigared Play Full: nuestro servicio de TV 100% online para ver donde quieras.\n🎁 PROMOS EXCLUSIVAS:\n🚀 Gigared Play Full: $10500\n🎬 Full + HBO Max: $10710\n(Incluye 50% OFF en GRP x 12 meses + 50% OFF en HBO x 3 meses)\n⚽ Full + Todo Fútbol: $19395\n(Incluye 50% OFF en GRP x 12 meses + 50% OFF en Pack Fútbol x 3 meses)\n⭐ Full + HBO + Fútbol: $22230\n(Combo completo: 75% OFF en GRP x 12 meses + 50% OFF en HBO y Fútbol x 3 meses)\n⚠️ Aclaraciones:\nPago exclusivo por débito automático (Tarjeta o CBU).\nPrecios sujetos a cambios tarifarios generales.\n📝 ¿Te interesa avanzar con el alta online? Solo necesitamos:\nNombre y Apellido:\nDNI y Fecha de nacimiento:\nPlan elegido:\nDomicilio, Localidad y CPA:\nMail y Teléfono:\n¡Quedamos atentos para darte el alta! 😊'},
  {id:32, cat:'vtas_offnet', title:'🚀 Instrucciones Alta Offnet WhatsApp', text:'¡Excelente! Ya ingresé tus datos para iniciar el alta. 🚀\nEn los próximos minutos te van a llegar los correos para activar el servicio. Es indispensable completar estos dos pasos:\n1️⃣ Débito automático: Te llegará un mail con el formulario de pago para que lo completes.\n2️⃣ Registro de usuario:Tras confirmar el pago, te llegará un segundo mail para crear tu clave en Espacio Giga. (Tu usuario final será "GIGA + tu número de cliente" con esa misma contraseña).\n⚠️ Si no los encontrás, revisá la carpeta de Correo no deseado o Spam.\nAntes de cerrar, ¿tenés alguna otra duda sobre el alta, la app o el proceso de baja? Avisame ahora así te ayudo.'},

  // TV Y GIGARED PLAY
  {id:33, cat:'tv_play_sec', title:'📺 Diferencia TV Tradicional vs Gigared Play', text:'Hola! Te cuento rápido cómo funcionan las dos opciones que ofrecemos para que elijas la que mejor se adapte a lo que buscás:\n📺 1. Servicio Tradicional (Por Cable + Internet) Es la instalación clásica en tu casa. Llevamos el servicio con nuestra red física de cables y fibra directo a tu domicilio\n📱 2. Gigared Play (Televisión por App) Es nuestra plataforma de TV online por streaming. ¡Televisión sin cables ni antenas!\n¿Cómo funciona?: Te bajás la App en tu Smart TV, celular o tablet.\n¿Qué incluye?: mas de 70 canales en vivo\nLa gran ventaja: No necesita instalación técnica. Solo necesitás tener internet en tu casa (de cualquier empresa) y ya podés usarla.\n¿Cuál de las dos opciones te interesa más así te paso los precios y promos vigentes? 😊'},
  {id:34, cat:'tv_play_sec', title:'📱 Cuestiones de Gigared Play y Mejora de Plan', text:'📌 Verificamos que ya contás con el servicio de TV.\nTe comento sobre Gigared Play 📱📺\n🎬 Gigared Play es nuestra plataforma digital donde podés visualizar todos los canales desde la misma aplicación.\n✅ Podés conectar hasta 5 dispositivos:\n📱 3 celulares / PC\n📺 2 Smart TV\n▶️ También podés utilizarlo en hasta 3 dispositivos en simultáneo.\n💰 Precio de lista: $9.900\n🎉 Podemos ofrecerte una promoción del 75% de descuento por 12 meses.\n😊 Si querés avanzar con el alta, te ayudo con la gestión.'},
  {id:35, cat:'tv_play_sec', title:'📺 Costos TV + Internet + Deco', text:'👋 Perfecto 😊\nEn ese caso, si querés solicitar…….. convencional con Televisión por cable, te detallo cómo quedaría:\n📺🌐 TV + Internet\n📄 Precio de lista:\n🎉 Manteniendo tu promoción vigente del % de descuento\n💰 Valor final:\n📦 Instalación del decodificador (STB):\n🔹 Opción 1: $70.500 en un solo pago.\n🔹 Opción 2: 3 cuotas de $23.500 c/u.\n🔹 Opción 3: Instalación del primer STB bonificada adhiriendo el servicio al débito automático.\nPack ……………\n📄 Precio de lista:\n🎉 Promocion:\n⚠️ Recordá que los precios no son fijos y pueden estar sujetos a futuras actualizaciones tarifarias.\n😊 Quedo atento si querés avanzar con la contratación.'},
  {id:36, cat:'tv_play_sec', title:'🎬 Ofrecer Packs Premium (HBO, HD, Fútbol)', text:'👋 Buenas tardes , Soy Guido.\nContame, ¿qué pack premium querés sumar?\n🎬 Puede ser HBO, ⚽ Pack Fútbol u otro de los disponibles.\nQuedo atento para ayudarte.\n—-----------------------------------------------------------------------------------------------------------------------\nTe paso las promociones disponibles para los Packs Premium y la instalación del deco:\nPack HBO: Incluye 8 señales (HBO, HBO Family, HBO 2, HBO Plus, HBO Signature, HBO Xtreme, HBO Mundi y HBO Pop). Tenés 6 meses al 50% de descuento (con días proporcionales a cargo). Precio de lista: $15200.\nPack HD: Incluye 86 señales de video y 36 de radio. Tenés 6 meses al 50% de descuento (con días proporcionales a cargo). Precio de lista: $15800\nPack Todo Fútbol: Incluye ESPN Premium y TNT Sports. Tenés 6 meses al 50% de descuento (con días proporcionales a cargo). Precio de lista: $27260\nOpciones para la instalación del decodificador (STB):\nOpción 1: Contado $73.800\nOpción 2: 3 cuotas de $24.600\nOpción 3: Instalación del primer equipo 100% bonificada adhiriendo tu pago al Débito Automático 💳'},

  // GESTION ADMINISTRATIVA - PAGOS Y COMPROBANTES
  {id:37, cat:'admin_pagos', title:'🖼️ Comprobante Incompleto / Captura de Pantalla', text:'Verificamos la captura enviada, pero en este caso no es posible validar el pago, ya que solo muestra el movimiento de la cuenta.\n\nPor favor, descarga el comprobante formal de la transferencia o pago en formato PDF y adjúntalo por este mismo medio para que podamos impactarlo en tu cuenta. ¡Aguardamos el archivo para continuar con la gestión!'},
  {id:38, cat:'admin_pagos', title:'💳 Pagar por Mercado Pago', text:'Para pagar por Mercado Pago, tenés que ir a la parte de pago de servicios, buscar la empresa Gigared y pone ingresar con numero de referencia, que es tu número de cliente: 300118376'},
  {id:39, cat:'admin_pagos', title:'🙌 Comprobante de Pago Recibido (Servicio Activo)', text:'¡Hola! Muchas gracias por enviar el comprobante 🙌\nTe confirmo que lo recibimos correctamente.\nAnte cualquier otra consulta, estoy a tu disposición. ¡Que tengas un excelente día!'},
  {id:40, cat:'admin_pagos', title:'⏳ Comprobante Recibido (Servicio Bloqueado / Sin Impactar)', text:'¡Hola! Muchas gracias por enviar el comprobante 🙌\nTe confirmo que lo recibimos correctamente y ya iniciamos la gestión con el área administrativa.\nEn breve tendrás nuevamente el servicio activo; te pedimos por favor mantener el equipo conectado.\nAnte cualquier otra consulta, estoy a tu disposición. ¡Que tengas un excelente día!'},
  {id:41, cat:'admin_pagos', title:'✅ Impacto de Pago Confirmado', text:'¡Hola! Muchas gracias por enviar el comprobante 🙌\nTe confirmo que lo recibimos correctamente y ya impacto de forma correcta en nuestro sistema. Quedando tu cuenta al dia / un saldo pendiente de $...\nAnte cualquier otra consulta, estoy a tu disposición. ¡Que tengas un excelente día!'},
  {id:42, cat:'admin_pagos', title:'⏳ Reclamos Administrativos - Pago No Impactado', text:'👋 Buenas tardes Maria 😊\n📌 Verificamos que por el momento el pago todavía no impactó en nuestro sistema.\n📌 En cuanto el pago impacte en nuestro sistema, el servicio retomará la habilitación de forma automática 😊\n⏳ Recordá que, si abonaste por fuera de Espacio Giga o de nuestro link de pago, la acreditación puede demorar hasta 72 horas hábiles.\n🙏 Quedamos atentos ante cualquier novedad.'},

  // GESTION ADMINISTRATIVA - CAMBIOS Y TRAMITES
  {id:43, cat:'admin_cambios', title:'👤 Cambio de Titularidad', text:'📌 Para solicitar el cambio de titularidad del servicio, el nuevo titular deberá enviarnos por este mismo medio la siguiente documentación:\n🆔 Foto del DNI del titular actual.\n🆔 Foto del DNI del nuevo titular.\n📝 Nota firmada por el titular actual autorizando el cambio de titularidad.\nDebe incluir:\n🔹 Nombre completo y DNI de ambas partes.\n🔹 Domicilio donde se encuentra instalado el servicio.\n📝 Nota firmada por el nuevo titular aceptando los servicios en el domicilio.\nDebe incluir:\n🔹 Nombre completo y DNI de ambas partes.\n🔹 Domicilio donde se encuentra instalado el servicio.\n📞 Número de teléfono del nuevo titular.\n😊 Quedamos atentos a la documentación para poder avanzar con la gestión.'},
  {id:44, cat:'admin_cambios', title:'🏠 Cambio de Domicilio - Solicitud Datos', text:'📌 Para solicitar el cambio de domicilio, por favor completá los siguientes datos:\n🔹 Nuevo domicilio exacto (calle, altura, piso y dpto):\n🔹 Teléfono de contacto:\n🛠️ Las instalaciones se realizan lo antes posible, en un plazo de 5 a 10 dias habiles.\n🎉 El costo correspondiente al cambio de domicilio se encuentra bonificado.\n😊 Quedamos atentos a la información para avanzar con la gestión.'},
  {id:45, cat:'admin_cambios', title:'🏠 Cambio de Domicilio - Confirmación e Instrucción Equipos', text:'📌 Su solicitud se encuentra registrada y sujeta a verificación técnica ✅\n🛠️ Las instalaciones se realizan dentro de un plazo estimado de 5 a 10 dias habiles\n🏠 Cuando se mude al nuevo domicilio, deberá trasladar los equipos entregados en comodato. Una vez que nuestros instaladores asistan, realizarán la instalación correspondiente.\n📦 Equipos a trasladar:\n🌐 Módem\n🔌 Transformador del módem\n🌐 Cable de red (en caso de contar con Cable Módem)\n😊 Quedamos atentos ante cualquier consulta.'},
  {id:46, cat:'admin_cambios', title:'💳 Adhesión al Débito Automático', text:'📌 Sí, podés adherirte al débito automático 😊\n💳 Medios disponibles:\n🔹 Tarjetas de crédito: Visa - MasterCard - American Express - Naranja\n🔹 CBU\nEn caso de adherir con tarjeta, necesitamos:\n🏦 Entidad bancaria (Visa - MasterCard - American Express - Naranja):\n💳 Número de tarjeta (16 dígitos):\n📅 Fecha de emisión:\n📅 Fecha de vencimiento:\nSi la adhesión es mediante CBU:\n🏦 Número de CBU (22 dígitos):\n😊 Quedamos atentos para continuar con la gestión.'},
  {id:47, cat:'admin_cambios', title:'⬆️ Upgrade de TV o Internet', text:'👋 😊\n📌 Comprendo. En ese caso podemos ofrecerte el alta del servicio de TV.\n📺🌐📞 TV + Internet 150 Mb + Telefonía fija\n📄 Precio de lista: $\n🎉 Podemos brindarte una promoción del% de descuento por 6 meses.\n💰 Valor final promocional: $\n🛠️ Te comento que las instalaciones se realizan dentro de un plazo estimado d\n⚠️ Recordá que los precios están sujetos a aumentos generales.\n😊 Quedamos atentos si querés avanzar con la gestión.'},
  {id:48, cat:'admin_cambios', title:'⬇️ Downgrade con Deuda y Sin Deuda', text:'👋 Carlos 😊\n📌 En este caso podemos ofrecerte realizar una baja de velocidad a 150 Mb.\n📺🌐 TV + Internet 📄 Precio de lista:\n🎉 Promoción vigente de bienvenida: % de descuento\n💰 Valor final:\n⚠️Recorda que los precios no son fijos\nSI TIENE DEUDA\n⚠️ Para poder gestionar la baja de velocidad, es necesario abonar como mínimo la factura vencida del mes pasado.\n🔗 Te comparto el link de pago: VERIFICAR SI TIENE DEUDA O NO\n📌 Al ingresar, seleccioná la opción “Mínimo de habilitación”.\n😊 Una vez realizado el pago, avisanos para poder continuar con la gestión.'},

  // RETENCION, PROMOCIONES Y BAJAS
  {id:49, cat:'ret_bajas_sec', title:'❌ Inicio Solicitud de Baja', text:'👋 Hola! 📱💬 Te voy a ayudar con tu caso.\nAntes de gestionar la baja, contame rápido:\n❓ ¿Es por precio, mudanza o algún inconveniente que podamos ayudarte a resolver?\n✅ Si es por otro motivo, decime y vemos qué alternativas tenemos para ayudarte.\nSi después de eso seguís queriendo continuar con la baja, ningún problema 👍 Solo necesito que me pases:\n- Nombre y apellido\n- DNI\n- N° de cliente\n- Domicilio y ciudad\n📅 Recordá que el preaviso es **antes del día 20**.\n📦 La baja se confirma cuando el titular devuelve los equipos en sucursal (con DNI) **antes del último día hábil del mes**. En caso contrario, la solicitud no se completa.\nQuedamos a la espera de tu confirmación 👌'},
  {id:50, cat:'ret_bajas_sec', title:'📋 Confirmación Preaviso de Baja', text:'Te contamos que ya tomamos tu pedido como un Preaviso de Baja en nuestro sistema. 📋\nPara que la Baja sea Efectiva ✅, el titular tiene que acercarse a la sucursal con su DNI para devolver los equipos. Tenés tiempo hasta el último día hábil del mes corriente 🗓️.\n⚠️ ¡Ojo! Si no llegás a devolverlos antes de esa fecha, la solicitud de baja queda sin efecto y el servicio seguirá activo.\n📦 ¿Qué tenés que traer?\nDe Internet:\n🌐 Módem.\n🔌 Transformador.\n📩 Cable de Red (si te lo instalaron).\n📍 ¿Dónde y cuándo?\nTe esperamos en nuestra sucursal de Lunes a Viernes, 09hs a 16hs. 🕓'},
  {id:51, cat:'ret_bajas_sec', title:'⚠️ Caso Deuda - Alta Bloqueada', text:'📌 En ese caso, no es posible realizar el alta del servicio mientras no contemos con la documentación solicitada o se regularice la deuda pendiente del domicilio.\n🙏 Te pedimos disculpas por los inconvenientes ocasionados y comprendemos la situación.\n😊 En caso de querer proseguir igualmente con la gestión, será necesario abonar la deuda del domicilio mediante pago telefónico para poder continuar con el alta.\nQuedamos atentos ante cualquier consulta.'},
  {id:52, cat:'ret_bajas_sec', title:'📄 Alta - Domicilio con Deuda (Documentación Exención)', text:'📌 Le informamos que en el domicilio indicado se registra un monto pendiente de pago de $COMPLETAR.\nPara poder desvincularse de dicha deuda, necesitamos que nos envíe la siguiente documentación:\n📄 Boleto de Compra/venta\n📄 Copia del contrato de alquiler vigente\n¿Cuenta con esta documentación? 😊\nEn caso de confirmarnos que dispone de la misma, podemos tomar su solicitud por este medio y continuar con la gestión.\n🙏 Muchas gracias por comunicarse con nosotros. Quedamos atentos a su respuesta.'},
  {id:53, cat:'ret_bajas_sec', title:'💳 Promo / Retención con Deuda Pendiente', text:'📌 Verificamos en el sistema y actualmente contás con una promoción vigente.\n🎉 Tenés aplicado un % de descuento, pero podemos ofrecerte una promoción mayor del % de descuento por 6 meses, quedando en $.\nPara poder aplicar la promoción, es necesario abonar la deuda acumulada de $ . Una vez regularizada la deuda, ¡podemos proceder con el beneficio! ✨📋'},
  {id:54, cat:'ret_bajas_sec', title:'🌟 Otorga Promoción Especial', text:'¡Hola!. 🌟\nHe cargado en tu cuenta una promoción especial del….% de descuento sobre tu pack actual por los próximos 6 meses, quedará con un costo de…\nA tener en cuenta:\n✅ El descuento se aplica sobre el precio de lista (si la tarifa cambia, el descuento se mantiene sobre el nuevo valor).\n✅ Impactará en tu factura de .\n✅ Los packs premium se facturan por separado.\nPodes ver nuestros medios de pago acá: 🔗 gigared.com.ar/mediosdepago'},
  {id:55, cat:'ret_bajas_sec', title:'✅ Promo Vigente Confirmada', text:'👋 Buenas tardes 😊\n📌 Verificamos en el sistema y actualmente contás con una promoción vigente.\n🎉 Tenés aplicado un % de descuento por meses más, inclusive desde el mes de .\nA tener en cuenta:\n✅ El descuento se aplica sobre el precio de lista (si la tarifa cambia, el descuento se mantiene sobre el nuevo valor).\n✅ Los packs premium se facturan por separado.\nYa se encuentra aplicada la promocion.\n😊 Quedamos atentos ante cualquier consulta.'},

let currentFilter = null;
let currentSearch = '';
let varsPendingItem = null;

function buildSidebar(){
  const container = document.getElementById('sidebar-cats');
  container.innerHTML = GROUPS.map(g => {
    const subs = SUBCATS.filter(s => s.parent === g.id);
    return `<div class="cat-group">
      <div class="cat-header">
        <button class="cat-btn" onclick="toggleGroup('sub-${g.id}', this)">
          <span class="cat-icon">${g.icon}</span> ${g.label} <span class="arrow">▶</span>
        </button>
      </div>
      <div class="subcat" id="sub-${g.id}">
        ${subs.map(s => `<button class="sub-btn" id="pill-${s.id}" onclick="filterCat('${s.id}')"><span class="sub-dot"></span>${s.icon}${s.label}</button>`).join('')}
      </div>
    </div>`;
  }).join('');
  document.getElementById('total-badge').textContent = DATA.length + ' respuestas';
}

function toggleGroup(id, btn){
  const el = document.getElementById(id);
  if(el){
    const open = el.classList.toggle('open');
    btn.classList.toggle('open', open);
  }
}

function filterCat(catId){
  currentFilter = catId;
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.toggle('active', b.id === 'pill-' + catId));
  render();
}

function showAll(){
  currentFilter = null;
  currentSearch = '';
  document.getElementById('search-in').value = '';
  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
  render();
}

function onSearch(input){
  currentSearch = input.value.trim().toLowerCase();
  render();
}

function getFiltered(){
  return DATA.filter(d => {
    const matchesCat = !currentFilter || d.cat === currentFilter;
    const matchesSearch = !currentSearch || d.title.toLowerCase().includes(currentSearch) || d.text.toLowerCase().includes(currentSearch);
    return matchesCat && matchesSearch;
  });
}

function render(){
  const list = getFiltered();
  const container = document.getElementById('list');
  container.innerHTML = list.map(item => {
    const sub = SUBCATS.find(s => s.id === item.cat);
    return `<div class="item">
      <div class="item-header">
        <span class="item-cat-badge">${sub ? sub.icon + ' ' + sub.label : 'General'}</span>
      </div>
      <div class="item-title">${item.title}</div>
      <div class="item-body">${item.text}</div>
      <div class="item-footer">
        <button class="copy-btn" onclick="handleCopy(${item.id})">📋 Copiar Respuesta</button>
      </div>
    </div>`;
  }).join('');
}

function handleCopy(id){
  const item = DATA.find(d => d.id === id);
  if(!item) return;

  const vars = [...item.text.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  if(vars.length > 0){
    openVarsModal(item, [...new Set(vars)]);
  } else {
    copyToClipboard(item.text);
  }
}

function openVarsModal(item, vars){
  varsPendingItem = item;
  document.getElementById('vars-panel-response-title').textContent = item.title;
  
  const form = document.getElementById('vars-form');
  form.innerHTML = vars.map((v, i) => `<div class="var-field-group">
    <label class="var-label">${v}</label>
    <input class="var-input" data-var="${v}" oninput="updateVarsPreview()" placeholder="Escribí ${v}...">
  </div>`).join('');

  updateVarsPreview();
  document.getElementById('vars-panel-overlay').classList.add('open');
}

function closeVarsPanel(){
  document.getElementById('vars-panel-overlay').classList.remove('open');
  varsPendingItem = null;
}

function updateVarsPreview(){
  if(!varsPendingItem) return;
  let text = varsPendingItem.text;
  document.querySelectorAll('.var-input').forEach(inp => {
    const v = inp.dataset.var;
    const val = inp.value.trim() || `[${v}]`;
    text = text.replaceAll(`[${v}]`, val);
  });
  document.getElementById('wa-bubble-text').textContent = text;
}

function executeVarsCopy(){
  const text = document.getElementById('wa-bubble-text').textContent;
  copyToClipboard(text);
  closeVarsPanel();
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text).then(() => {
    toast('¡Texto copiado al portapapeles! 📋');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('¡Texto copiado al portapapeles! 📋');
  });
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// FUNCIONES IMPORTAR Y EXPORTAR JSON
function exportJSON() {
  const dataToExport = {
    groups: GROUPS,
    subcats: SUBCATS,
    responses: DATA,
    exportDate: new Date().toISOString()
  };

  const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `respuestas_gigared_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('¡Archivo JSON exportado con éxito! 📤');
}

function importJSON() {
  document.getElementById('json-file-input').click();
}

function processJSONImport(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.responses && Array.isArray(imported.responses)) {
        DATA.length = 0;
        imported.responses.forEach(r => DATA.push(r));
        render();
        document.getElementById('total-badge').textContent = DATA.length + ' respuestas';
        toast('¡Respuestas importadas correctamente! 📥');
      } else {
        alert('El archivo JSON no tiene la estructura correcta de respuestas.');
      }
    } catch (err) {
      alert('Error al leer el archivo JSON. Asegúrate de que sea un JSON válido.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

buildSidebar();
render();
</script>
